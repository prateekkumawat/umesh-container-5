apiVersion: v1
kind: Namespace
metadata:
  name: postgresql

---
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: postgresql 
type: Opaque
data:
  password: ZmxlY3RyYWcxMjM= 

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-vol
  namespace: postgresql
spec:
  resources:
    requests:
      storage: 2Gi
  storageClassName: hostpath
  accessModes:
    - ReadWriteOnce

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: postgresql 
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
      - name: postgres-data-vol
        persistentVolumeClaim: 
          claimName: postgres-vol  
      containers:
      - name: postgres
        image: postgres:latest 
        resources:
          requests: 
            memory: "100Mi"
            cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "800m"
        ports:
        - containerPort: 5432
        env: 
        - name: POSTGRES_PASSWORD
          valueFrom: 
            secretKeyRef: 
              name: pg-admin-secret
              key: password 
        volumeMounts:
        - name: postgres-data-vol
          mountPath: /var/lib/postgresql/18/docker

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: postgresql
spec:
  selector:
    app: postgres
  type: ClusterIP
  ports:
  - name: postgres-port
    protocol: TCP
    port: 5432
    targetPort: 5432