services: 
  web: 
    image: nginx:latest
    container_name: web_container
    ports: 
      - "8080:80"

  mysql: 
    image: mysql:5.7
    container_name: mysql_container
    environment: 
      MYSQL_ROOT_PASSWORD: redhat123
      MYSQL_DATABASE: testdb
      MYSQL_USER: myapp
      MYSQL_PASSWORD: myapppassword    
    volumes:
       - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

